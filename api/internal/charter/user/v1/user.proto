syntax = "proto3";

package charter.user.v1;

option go_package = "github.com/LarsSeverson/charter/gen/charter/user/v1;userv1";

message User {
  string     id            = 1;
  UserStatus status        = 2;
  string     primary_email = 3;
}

enum UserStatus {
  USER_STATUS_PENDING   = 0;
  USER_STATUS_ACTIVE    = 1;
  USER_STATUS_SUSPENDED = 2;
  USER_STATUS_CLOSED    = 3;
}
