syntax = "proto3";

package charter.user.v1;

option go_package = "github.com/LarsSeverson/charter/gen/grpc/user/v1;userv1";

service UserService {
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
}

message CreateUserRequest {}

message CreateUserResponse {
  string id     = 1;
  string status = 2;
}
